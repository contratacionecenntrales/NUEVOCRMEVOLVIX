<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolvix Global · Facturación de Grupo</title>
<style>
:root{
  --bg:#0B1120; --card:#121A2E; --card-2:#0F1626; --line:#1F2A44;
  --text:#E2E8F0; --muted:#8A96AE; --brand:#EF7F14; --blue:#60A5FA;
  --green:#4ADE80; --amber:#FBBF24; --red:#F87171; --teal:#17C8C0;
  --serie-ingresos:#2F8CF0; --serie-gastos:#D9701A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;flex:0 0 230px;background:var(--card-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:22px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.brand .iso{width:34px;height:34px;border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .iso img{width:24px;height:24px;display:block}
.brand .txt{font-weight:700;font-size:14px;line-height:1.25}
.brand .txt span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.nav{flex:1;padding:8px 10px 14px;overflow-y:auto}
.nav-sec{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 6px}
.nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:none;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;text-align:left}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.on{background:rgba(239,127,20,.14);color:var(--brand)}
.badge{margin-left:auto;background:var(--brand);color:#1A0D02;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;line-height:16px}
.user-card{padding:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#1A0D02;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.user-card .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-card .rl{font-size:11px;color:var(--muted)}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;display:inline-flex}
.icon-btn:hover{background:var(--card);color:var(--text)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.topbar h2{margin:0;font-size:17px}
.content{padding:24px;flex:1;min-width:0}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.kpi .lbl{font-size:12px;color:var(--muted)}
.card.kpi .val{font-size:24px;font-weight:700;margin-top:6px;white-space:nowrap}
.card.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:16px}
.card-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn-p{background:var(--brand);border-color:var(--brand);color:#1A0D02;font-weight:600}
.btn-p:hover{opacity:.9}
.btn-xs{padding:5px 9px;font-size:12px}
.btn-ghost{background:none;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 9px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:none;padding-top:12px}
.tbl .acc{text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--card-2);border:1px solid var(--line);white-space:nowrap}
.chip.green{background:rgba(74,222,128,.12);color:var(--green);border-color:transparent}
.chip.amber{background:rgba(251,191,36,.12);color:var(--amber);border-color:transparent}
.chip.red{background:rgba(248,113,113,.12);color:var(--red);border-color:transparent}
.chip.blue{background:rgba(96,165,250,.12);color:var(--blue);border-color:transparent}
.chip.teal{background:rgba(23,200,192,.12);color:var(--teal);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font-size:13.5px;font-family:inherit}
.inp:focus{outline:none;border-color:var(--brand)}
.inp.auto{border-color:rgba(23,200,192,.5);background:rgba(23,200,192,.06)}
input[type=date].inp{color-scheme:dark}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.row{display:flex;align-items:center}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(2,6,16,.72);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto}
.search{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card-2)}
.search input{flex:1;min-width:0;background:none;border:none;color:var(--text);outline:none;font-size:13.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:11px 18px;border-radius:10px;font-size:13px;z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.filtros{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filtros select.inp{width:auto;min-width:130px}
.aviso{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(239,127,20,.09);border:1px solid rgba(239,127,20,.3);margin-bottom:16px;flex-wrap:wrap}
.aviso .tx{flex:1;min-width:200px;font-size:13px}
.resumen-linea{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.resumen-linea b{color:var(--text);font-weight:600}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;max-width:380px;width:100%}
.login-card h1{font-size:19px;margin:0 0 4px;text-align:center}
.login-logo{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 16px}
.login-logo img{width:64px;height:64px;display:block}
.login-logo .wm{display:flex;flex-direction:column;line-height:1;text-align:left}
.login-logo .wm b{font-size:34px;font-weight:700;letter-spacing:.5px;color:#F1F5F9}
.login-logo .wm span{font-size:15px;font-weight:500;letter-spacing:7px;color:#E2E8F0;margin-top:6px;padding-left:2px}
.login-card p.tag{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 26px}
.lg-err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#FCA5A5;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:14px}

/* Subir facturas */
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:none;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.opciones{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.opciones .lb{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed #2A3A5E;border-radius:14px;padding:36px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--card-2);color:var(--muted)}
.drop:hover,.drop.on{border-color:var(--brand);background:rgba(239,127,20,.06);color:var(--text)}
.drop .big{font-size:16px;font-weight:600;color:var(--text)}
.drop .ico{width:52px;height:52px;border-radius:14px;background:rgba(239,127,20,.12);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.drop-ov{position:fixed;inset:0;z-index:300;background:rgba(11,17,32,.88);display:flex;align-items:center;justify-content:center;pointer-events:none;padding:20px}
.drop-ov .in{border:2px dashed var(--brand);border-radius:22px;padding:50px 40px;text-align:center;font-size:19px;font-weight:600;background:rgba(239,127,20,.08);max-width:520px}
.drop-ov .in div{font-size:13px;font-weight:400;color:var(--muted);margin-top:8px}
.up-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card-2);margin-bottom:8px}
.up-row .nm{flex:1;min-width:0}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .2s}
.bar.ind>i{width:35%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.doc{display:flex;gap:18px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:12px;transition:opacity .45s,transform .45s}
.doc.listo{opacity:0;transform:translateX(40px)}
.doc .th{flex:0 0 104px;height:140px;border-radius:9px;background:#0A0F1C;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none}
.doc .th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;background:#fff}
.doc .bd{flex:1;min-width:0}
.doc .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.doc .hd .fn{font-weight:600;min-width:0;max-width:100%}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fgrid .field{margin:0}
.fgrid .w2{grid-column:span 2}
.doc .ft{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.doc .tot{margin-left:auto;text-align:right}
.doc .tot b{font-size:19px;display:block}
.warn{color:var(--amber);font-size:12px}

/* Gráficos */
.leyenda{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;height:210px;margin-top:8px;padding-left:52px}
.chart .eje{position:absolute;left:52px;right:0;border-top:1px solid var(--line)}
.chart .eje span{position:absolute;right:calc(100% + 8px);top:-8px;font-size:11px;color:var(--muted);white-space:nowrap}
.chart .cols{position:absolute;left:52px;right:0;top:0;bottom:22px;display:flex;align-items:stretch}
.chart .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative;cursor:default;outline:none}
.chart .col:hover,.chart .col:focus{background:rgba(255,255,255,.03)}
.chart .col i{display:block;width:min(14px,32%);border-radius:4px 4px 0 0;min-height:0}
.chart .col .mes{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.chart .col .mes .c{display:none}
.solo-tactil{display:none}
@media(hover:none),(pointer:coarse){.solo-tactil{display:inline}.solo-raton{display:none}}
.chart .tip{position:absolute;z-index:5;background:#0A0F1C;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;pointer-events:none;white-space:nowrap;transform:translateX(-50%);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.chart .tip .r{display:flex;align-items:center;gap:7px;margin-top:3px}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;font-size:12.5px;margin-bottom:9px}
.hbar .tr{height:10px;background:var(--card-2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--serie-gastos)}
.cifra{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.cifra:last-child{border-bottom:none}
.cifra.total{font-weight:700;font-size:15px}

@media(max-width:1100px){.g-3{grid-template-columns:repeat(2,1fr)}.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .g-2{grid-template-columns:1fr}
  .sidebar{width:64px;flex:0 0 64px}
  .brand{padding:18px 15px}
  .brand .txt,.nav-item span,.nav-sec,.user-card .nm,.user-card .rl{display:none}
  .nav-item{justify-content:center}
  .badge{position:absolute;top:3px;right:5px;margin:0;font-size:10px;padding:0 5px}
  .user-card{flex-direction:column;justify-content:center;padding:10px 6px}
}
@media(max-width:600px){
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .content{padding:14px}
  .topbar{padding:14px}
  .card{padding:14px}
  .card.kpi .val{font-size:21px}
  .doc{flex-direction:column}
  .doc .th{flex:none;width:100%;height:170px}
  .fgrid .w2{grid-column:auto}
  .filtros select.inp{flex:1}
  .chart{padding-left:40px}
  .chart .eje,.chart .cols{left:40px}
  .chart .col .mes .l{display:none}
  .tbl.cp tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .tbl.cp tbody tr:last-child{border-bottom:none}
  .tbl.cp td{border:none;padding:0}
  .tbl.cp td:first-child{flex:1 1 100%}
  .tbl.cp td.num{flex:1;text-align:left}
  .chart .col .mes .c{display:inline}
}
</style>
</head>
<body>
<script>
/* ==========================================================================
   EVOLVIX GLOBAL · Facturación de Grupo
   Panel estático (sin build) que habla con su propia API en PHP, en el
   mismo dominio (api/*.php). Todo lo que protege de verdad son las
   comprobaciones de sesión y de rol del lado del servidor (api/seguridad.php),
   no este JavaScript.

   Las facturas que se arrastran al panel se leen AQUÍ, en el navegador, con
   pdf.js (vendor/pdfjs): el texto del PDF nunca sale a ningún servicio de
   fuera. Lo leído solo es una propuesta: la persona lo revisa y contabiliza.
   ========================================================================== */

function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Formato español con punto de miles siempre (Intl no lo pone en 4 cifras).
function miles(n, dec){
  n = Number(n)||0;
  var s = Math.abs(n).toFixed(dec).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (n<0?'-':'')+s[0]+(dec?','+s[1]:'');
}
function eur(n){ return miles(n,2)+' €'; }
function eurCorto(n){ n=Number(n)||0; var a=Math.abs(n);
  if(a>=1000000) return miles(n/1000000,1)+' M€';
  if(a>=10000) return miles(n/1000,0)+' k€';
  if(a>=1000) return miles(n/1000,1)+' k€';
  return miles(n,0)+' €'; }
function pct(n){ n=Number(n)||0; return (Math.round(n*100)/100).toString().replace('.',',')+' %'; }
// Acepta 1.234,56 · 1234,56 · 1,234.56 · 1234.56 · -12 · (12,00)
function parseImporte(s){
  if(typeof s==='number') return s;
  s = String(s||'').replace(/[€\s]|EUR/gi,'');
  if(!s) return 0;
  var neg = /^-/.test(s) || /^\(.*\)$/.test(s) || /-$/.test(s);
  s = s.replace(/[()\-+]/g,'');
  var c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  if(c>-1 && d>-1){ s = c>d ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if(c>-1){ s = s.split(',').length===2 ? s.replace(',','.') : s.replace(/,/g,''); }
  else if(d>-1){ var p=s.split('.'); if(p.length>2 || p[p.length-1].length===3) s = s.replace(/\./g,''); }
  var n = parseFloat(s);
  if(isNaN(n)) return 0;
  return neg ? -n : n;
}
function r2(n){ return Math.round((Number(n)||0)*100)/100; }
function numIn(n){ n=Number(n)||0; return n===0 ? '' : String(r2(n)).replace('.',','); }
function fFecha(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diasEntre(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function anioDe(iso){ return iso ? Number(String(iso).slice(0,4)) : 0; }
function trimDe(iso){ return iso ? Math.floor((Number(String(iso).slice(5,7))-1)/3)+1 : 0; }
var MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function toast(msg){
  qa('.toast').forEach(function(t){ t.parentNode.removeChild(t); });
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3400);
}

/* ------------------------------ API --------------------------------- */
var API = { csrf:'' };
function apiFetch(ruta, opciones){
  opciones = opciones || {};
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  var corte = ctrl ? setTimeout(function(){ ctrl.abort(); }, 20000) : null;
  var cabeceras = {'Content-Type':'application/json'};
  if(opciones.method && opciones.method!=='GET') cabeceras['X-CSRF-Token'] = API.csrf;
  return fetch('api/'+ruta, {
    method: opciones.method||'GET',
    credentials: 'same-origin',
    headers: cabeceras,
    body: opciones.body ? JSON.stringify(opciones.body) : undefined,
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r){
    if(corte) clearTimeout(corte);
    return r.text().then(function(t){
      var datos=null; try{ datos = t?JSON.parse(t):null; }catch(e){ datos={mensaje:t}; }
      if(r.status===401 && S.logged && ruta!=='login.php') sesionCaducada();
      return {ok:r.ok && datos && datos.ok!==false, estado:r.status, datos:datos};
    });
  }, function(err){
    if(corte) clearTimeout(corte);
    return {ok:false, estado:0, datos:{mensaje: err&&err.name==='AbortError'
      ? 'La conexión ha tardado demasiado.' : 'No se ha podido contactar con el servidor.'}};
  });
}
// Con EVOLVIX_DEPURAR activado en api/config.php, el servidor añade el
// detalle técnico del error: se muestra para poder diagnosticarlo.

/* ------------------------------ ARRANQUE -------------------------------- */
function entra(p, csrf){
  API.csrf = csrf;
  S.logged = true; S.role = p.rol; S.name = (p.nombre+' '+(p.apellidos||'')).trim(); S.email = p.email;
  S.view = 'dashboard';
  renderApp();
}
function boot(){
  LOGIN.cargando = true; renderLogin();
  apiGet('sesion.php').then(function(r){
    LOGIN.cargando = false;
    if(!r.ok || !r.datos || !r.datos.usuario){ renderLogin(); return; }
    entra(r.datos.usuario, r.datos.csrf);
  });
}
function reiniciaDatos(){
  MARCAS.cargado=false; CLIENTES.cargado=false; DATA.cargado=false; DATA.error=''; DATA.facturas=[]; DATA.docs=[];
  UP.cola=[]; UP.edit={}; UP.extra={}; UP.thumbs={}; UP.thumbPend={};
}
function sesionCaducada(){
  S.logged=false; reiniciaDatos();
  LOGIN.error='Tu sesión ha caducado. Vuelve a entrar.'; renderLogin();
}

function renderLogin(){

  document.body.innerHTML =
  '<div class="login-wrap"><div class="login-card">'+
    '<h1 class="login-logo" aria-label="Evolvix Global"><img src="evolvix-icono.png" alt="">'+
      '<span class="wm"><b>EVOLVIX</b><span>GLOBAL</span></span></h1>'+

    err+

      '<input class="inp" id="lg-mail" type="email" value="'+esc(LOGIN.mail)+'" placeholder="tu@evolvixglobal.com" autocomplete="username"></div>'+
    '<div class="field"><label>Contraseña</label>'+
      '<input class="inp" id="lg-pass" type="'+(LOGIN.ver?'text':'password')+'" value="'+esc(LOGIN.pass)+'" autocomplete="current-password"></div>'+
    '<button class="btn btn-p" id="lg-entrar" style="width:100%;justify-content:center;margin-top:6px" '+(LOGIN.cargando?'disabled':'')+'>'+
      (LOGIN.cargando ? 'Comprobando...' : (ic('logout',15)+' Entrar'))+'</button>'+
  '</div></div>';

  if(q('#lg-mail')) q('#lg-mail').oninput = function(){ LOGIN.mail = this.value; };
  if(q('#lg-pass')) q('#lg-pass').oninput = function(){ LOGIN.pass = this.value; };
  var enviar = function(){
    if(!LOGIN.mail || !LOGIN.pass){ LOGIN.error = 'Escribe tu correo y tu contraseña.'; renderLogin(); return; }
    LOGIN.error=''; LOGIN.cargando = true; renderLogin();
    apiPost('login.php', {email:LOGIN.mail, password:LOGIN.pass}).then(function(r){
      LOGIN.cargando = false;
      if(!r.ok || !r.datos || !r.datos.usuario){ LOGIN.error = apiMensaje(r); renderLogin(); return; }
      LOGIN.pass = '';
      entra(r.datos.usuario, r.datos.csrf);
    });
  };
  if(q('#lg-entrar')) q('#lg-entrar').onclick = enviar;
  if(q('#lg-pass')) q('#lg-pass').onkeydown = function(e){ if(e.key==='Enter') enviar(); };
}

/* ------------------------------ DATOS ------------------------------------ */
function cargaTodo(){
  DATA.cargando = true;
  return Promise.all([apiGet('marcas.php'), apiGet('clientes.php'), apiGet('facturas.php'), apiGet('documentos.php')]).then(function(rs){
    DATA.cargando = false;
    var fallo = rs.filter(function(r){ return !r.ok; })[0];
    DATA.error = fallo ? apiMensaje(fallo) : '';
    if(rs[0].ok){ MARCAS.lista = rs[0].datos.datos||[]; MARCAS.cargado = true; }
    if(rs[1].ok){ CLIENTES.lista = rs[1].datos.datos||[]; CLIENTES.cargado = true; }
    if(rs[2].ok) DATA.facturas = rs[2].datos.datos||[];
    if(rs[3].ok) DATA.docs = rs[3].datos.datos||[];
    DATA.cargado = !fallo;
    if(S.logged) renderApp();
  });
}
function marcaPorId(id){ return MARCAS.lista.filter(function(m){ return Number(m.id)===Number(id); })[0]; }
function nombreMarca(id){ var m = marcaPorId(id); return m?m.nombre:'—'; }
function colorMarca(id){ var m = marcaPorId(id); return m?m.color:'#8A96AE'; }
function marcaCorta(id){ return nombreMarca(id).replace(/\s*\(.*\)\s*$/,''); }
function dotMarca(id){ return '<span class="dot" style="background:'+esc(colorMarca(id))+'"></span>'; }
function clientePorId(id){ return CLIENTES.lista.filter(function(c){ return Number(c.id)===Number(id); })[0]; }
function nombreCliente(id){ var c = clientePorId(id); return c?c.nombre:'—'; }
function opcionesMarca(sel, todas){
  return (todas ? '<option value="">'+todas+'</option>' : '')+

}

// Una sola forma de fila para los libros: venga del CRM o de un PDF subido.
function filasLibro(){
  var out = [];
  DATA.facturas.forEach(function(f){
    var c = clientePorId(f.cliente_id) || {};
    var base = Number(f.base)||0, total = Number(f.total)||0;
    out.push({key:'f'+f.id, origen:'crm', id:f.id, tipo:'emitida', marca_id:Number(f.marca_id), numero:f.numero,
      fecha:f.fecha_emision, vencimiento:null, contraparte:c.nombre||'—', nif:c.cif||'', categoria:'',
      base:base, iva_pct:Number(f.iva)||0, cuota_iva:r2(total-base), irpf_pct:0, cuota_irpf:0, total:total,
      estado:f.estado, fecha_pago:f.fecha_pago, archivo:false});
  });
  DATA.docs.forEach(function(d){
    if(!d.contabilizado) return;
    out.push({key:'d'+d.id, origen:'doc', id:d.id, tipo:d.tipo, marca_id:Number(d.marca_id), numero:d.numero,
      fecha:d.fecha, vencimiento:d.vencimiento, contraparte:d.contraparte, nif:d.nif, categoria:d.categoria,
      base:d.base, iva_pct:d.iva_pct, cuota_iva:d.cuota_iva, irpf_pct:d.irpf_pct, cuota_irpf:d.cuota_irpf, total:d.total,
      estado:d.estado, fecha_pago:d.fecha_pago, archivo:d.tiene_archivo, archivo_nombre:d.archivo_nombre});
  });
  return out;
}
function enPeriodo(f, anio, trim){
  if(anio && anioDe(f.fecha)!==Number(anio)) return false;
  if(trim && trimDe(f.fecha)!==Number(trim)) return false;
  return true;
}
function aniosConDatos(){
  var a = {}; a[ANIO]=1;
  filasLibro().forEach(function(f){ if(f.fecha) a[anioDe(f.fecha)]=1; });
  return Object.keys(a).map(Number).sort(function(x,y){ return y-x; });
}
function chipEstado(e, tipo){
  var txt = e==='Pagada' ? (tipo==='emitida'?'Cobrada':'Pagada') : e;
  var cls = e==='Pagada'?'green':e==='Pendiente'?'amber':e==='Impagada'?'red':'';
  return '<span class="chip'+(cls?' '+cls:'')+'">'+esc(txt)+'</span>';
}
function cambiaEstado(fila, estado){
  var p = fila.origen==='crm' ? apiPatch('facturas.php?id='+fila.id, {estado:estado}) : apiPatch('documentos.php?id='+fila.id, {estado:estado});
  p.then(function(r){
    if(r&&r.ok){ toast(estado==='Pagada' ? (fila.tipo==='emitida'?'Marcada como cobrada.':'Marcada como pagada.') : 'Estado actualizado.'); cargaTodo(); }
    else toast('No se ha podido actualizar: '+apiMensaje(r));
  });
}

/* ---------------------------- RESUMEN ----------------------------------- */
function sumas(lista){
  var s = {n:0, base:0, iva:0, irpf:0, total:0, cobrado:0, pendiente:0, impagado:0};
  lista.forEach(function(f){
    if(f.estado==='Anulada') return;
    s.n++; s.base+=f.base; s.iva+=f.cuota_iva; s.irpf+=f.cuota_irpf; s.total+=f.total;
    if(f.estado==='Pagada') s.cobrado+=f.total;
    else if(f.estado==='Impagada') s.impagado+=f.total;
    else s.pendiente+=f.total;
  });
  return s;
}

  if(!DATA.cargado){ v.innerHTML = cargando(); return; }
  var filas = filasLibro().filter(function(f){ return enPeriodo(f, RES.anio, 0); });

    ['Pendiente de cobro', eur(E.pendiente+E.impagado), 'amber', E.impagado ? 'de ello impagado: '+eur(E.impagado) : 'nada impagado'],
    ['Gastos '+RES.anio, eur(R.total), 'text', R.n+' facturas · base '+eur(R.base)],

  (pend ? '<div class="aviso">'+ic('spark',18)+'<div class="tx"><b>'+pend+' factura'+(pend>1?'s':'')+' por revisar.</b> Están subidas pero todavía no cuentan en los libros ni aquí.</div>'+

  '<div class="filtros"><select class="inp" id="rs-anio">'+aniosConDatos().map(function(a){ return '<option'+(a===RES.anio?' selected':'')+'>'+a+'</option>'; }).join('')+'</select>'+
    '<span class="muted tiny">Grupo Evolvix Global y sus marcas (Labs24k, ICC...), todo junto.</span></div>'+
  '<div class="grid g-3" style="margin-bottom:16px">'+
    kpis.map(function(k){ return '<div class="card kpi"><div class="lbl">'+k[0]+'</div><div class="val" style="color:var(--'+k[2]+')">'+k[1]+'</div><div class="sub">'+esc(k[3])+'</div></div>'; }).join('')+
  '</div>'+
  '<div class="card" style="margin-bottom:16px">'+
    '<div class="card-h"><div><h3>Ingresos y gastos por mes</h3><p>Base imponible (sin IVA) de las facturas contabilizadas de '+RES.anio+'. Pasa el ratón o toca un mes para ver las cifras.</p></div>'+
      '<div class="leyenda"><span><i style="background:var(--serie-ingresos)"></i>Ingresos</span><span><i style="background:var(--serie-gastos)"></i>Gastos</span></div></div>'+
    graficoMeses(em, re)+
  '</div>'+
  '<div class="card">'+
    '<div class="card-h"><div><h3>Por marca</h3><p>Lo facturado por cada marca y lo que ha gastado, en '+RES.anio+'.</p></div></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th>Marca</th><th class="num">Facturas</th><th class="num">Facturado</th><th class="num">Cobrado</th><th class="num">Por cobrar</th><th class="num">Gastos</th><th class="num">Resultado</th>'+

      (porMarca.map(function(x){

function escalaBonita(max){
  if(max<=0) return 1000;
  var p = Math.pow(10, Math.floor(Math.log10(max)));
  var pasos = [1,2,2.5,5,10];
  for(var i=0;i<pasos.length;i++){ if(pasos[i]*p >= max) return pasos[i]*p; }
  return 10*p;
}
function graficoMeses(em, re){

  em.forEach(function(f){ if(f.estado!=='Anulada' && f.fecha) ing[Number(f.fecha.slice(5,7))-1]+=f.base; });
  re.forEach(function(f){ if(f.estado!=='Anulada' && f.fecha) gas[Number(f.fecha.slice(5,7))-1]+=f.base; });
  var max = escalaBonita(Math.max.apply(null, ing.concat(gas)));
  GRAF = {ing:ing, gas:gas};
  var alto = 'calc((100% - 22px) * ';
  var ejes = [0, .5, 1].map(function(t){
    return '<div class="eje" style="bottom:calc(22px + '+alto+t+'))"><span>'+eurCorto(max*t)+'</span></div>';
  }).join('');
  var cols = MESES.map(function(mes, i){
    var hi = Math.max(0, ing[i])/max*100, hg = Math.max(0, gas[i])/max*100;
    return '<div class="col" tabindex="0" data-mes="'+i+'" aria-label="'+mes+': ingresos '+eur(ing[i])+', gastos '+eur(gas[i])+'">'+

  }).join('');
  return '<div class="chart" id="graf">'+ejes+'<div class="cols">'+cols+'</div><div class="tip" id="graf-tip" style="display:none"></div></div>';
}

// --- Subida -------------------------------------------------------------------
function subeArchivos(lista){
  var files = Array.prototype.slice.call(lista||[]);
  if(!files.length) return;
  files.forEach(function(file){
    UP.cola.push({uid:++UP.n, nombre:file.name, file:file, fase:'preparando', progreso:0, error:''});
  });
  if(S.view!=='bandeja'){ S.view='bandeja'; window.scrollTo(0,0); }
  renderApp();
  siguienteDeLaCola();
}
// De una en una: se ven entrar en orden y no se satura el hosting.
function siguienteDeLaCola(){
  if(UP.ocupado) return;
  var it = UP.cola.filter(function(i){ return i.fase==='preparando'; })[0];
  if(!it) return;
  UP.ocupado = true;
  procesa(it).catch(function(){ falla(it, 'No se ha podido procesar este archivo. Prueba otra vez.'); })
    .then(function(){ UP.ocupado = false; siguienteDeLaCola(); });
}
function pintaCola(it){
  var t = q('#cola-txt-'+it.uid), b = q('#cola-bar-'+it.uid);
  if(t) t.textContent = it.fase==='subiendo' ? 'Subiendo '+it.progreso+' %' : t.textContent;
  if(b) b.style.width = it.progreso+'%';
}
function falla(it, msg){ it.fase='error'; it.error=msg; delete it.file; renderApp(); }
function procesa(it){
  var file = it.file;
  var esPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  var esImg = /^image\/(jpeg|png|webp)$/i.test(file.type);
  if(!esPdf && !esImg){
    falla(it, /heic|heif/i.test(file.type+file.name) ? 'Las fotos HEIC del iPhone no se admiten: expórtala como JPG.' : 'Solo se admiten PDF o fotos (JPG, PNG, WEBP).');
    return Promise.resolve();
  }
  // Se lee el PDF (o se reduce la foto) a la vez que se sube.
  var lectura = esPdf ? leePdf(file).catch(function(){ return {lineas:[], miniatura:null, sinTexto:true}; })
                      : preparaFoto(file);
  return lectura.then(function(leido){
    var blob = leido.blob || file, nombre = leido.nombre || file.name;
    it.fase='subiendo'; renderApp();
    return subeXHR(it, blob, nombre).then(function(r){
      if(!r.ok){ falla(it, apiMensaje(r)); return; }
      var doc = r.datos.datos;
      it.fase='leyendo'; renderApp();
      var extra = {auto:{}, avisos:[], totalLeido:null};
      var datos = {};
      if(leido.lineas && leido.lineas.length){
        datos = extraeDatos(leido.lineas, extra);
      } else {
        extra.avisos.push(esPdf ? 'Este PDF no tiene texto (parece escaneado): rellena los datos mirando la miniatura.'
                                : 'Es una foto: rellena los datos mirando la miniatura.');
      }
      if(UP.tipo!=='auto'){ datos.tipo = UP.tipo; delete extra.auto.tipo; }
      if(UP.marca!=='auto'){ datos.marca_id = Number(UP.marca); delete extra.auto.marca_id; }
      if(!datos.tipo) datos.tipo = 'recibida';
      if(!datos.marca_id){ var grupo = MARCAS.lista.filter(function(m){ return m.prefijo==='EVO'; })[0]; if(grupo) datos.marca_id = Number(grupo.id); }
      UP.extra[doc.id] = extra;
      if(leido.miniatura) UP.thumbs[doc.id] = leido.miniatura;
      it.fase='guardando';
      return apiPatch('documentos.php?id='+doc.id, datos).then(function(r2){
        var final = (r2&&r2.ok) ? r2.datos.datos : doc;
        DATA.docs.unshift(final);
        UP.cola = UP.cola.filter(function(i){ return i!==it; });
        renderApp();
      });
    });
  });
}
function subeXHR(it, blob, nombre){
  return new Promise(function(res){
    var fd = new FormData();
    fd.append('archivo', blob, nombre);
    fd.append('tipo', UP.tipo==='emitida' ? 'emitida' : 'recibida');
    fd.append('marca_id', UP.marca!=='auto' ? UP.marca : '');
    var x = new XMLHttpRequest();
    x.open('POST', 'api/documentos.php');
    x.setRequestHeader('X-CSRF-Token', API.csrf);
    x.upload.onprogress = function(e){ if(e.lengthComputable){ it.progreso = Math.round(e.loaded/e.total*100); pintaCola(it); } };
    x.onload = function(){
      var d=null; try{ d=JSON.parse(x.responseText); }catch(e){}
      if(x.status===401) sesionCaducada();
      res({ok:x.status>=200 && x.status<300 && d && d.ok, estado:x.status, datos:d||{mensaje:'Respuesta no válida del servidor ('+x.status+').'}});
    };
    x.onerror = function(){ res({ok:false, estado:0, datos:{mensaje:'No se ha podido contactar con el servidor.'}}); };
    x.send(fd);
  });
}
// Fotos del móvil: se reducen a ~2200 px para que suban rápido y quepan en
// el límite del hosting, sin perder legibilidad.
function preparaFoto(file){
  if(typeof createImageBitmap!=='function') return Promise.resolve({lineas:[], miniatura:null});
  return createImageBitmap(file).then(function(bmp){
    var mini = dibujaMiniatura(bmp, bmp.width, bmp.height);
    var lado = Math.max(bmp.width, bmp.height);
    if(file.size < 1.5*1024*1024 && lado <= 2400) return {lineas:[], miniatura:mini};
    var k = Math.min(1, 2200/lado), c = document.createElement('canvas');
    c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(function(res){
      c.toBlob(function(b){ res({lineas:[], miniatura:mini, blob:b||file, nombre:b ? file.name.replace(/\.[^.]+$/,'')+'.jpg' : file.name}); }, 'image/jpeg', 0.86);
    });
  }, function(){ return {lineas:[], miniatura:null}; });
}
function dibujaMiniatura(fuente, w, h){
  var c = document.createElement('canvas'), k = 240/w;
  c.width = 240; c.height = Math.round(h*k);
  var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
  g.drawImage(fuente, 0, 0, c.width, c.height);
  try{ return c.toDataURL('image/jpeg', 0.75); }catch(e){ return null; }
}

// --- pdf.js ---------------------------------------------------------------------
var PDFJS = null;
function cargaPdfJs(){
  if(PDFJS) return PDFJS;
  PDFJS = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'vendor/pdfjs/pdf.min.js';
    s.onload = function(){ var L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs/pdf.worker.min.js'; res(L); };
    s.onerror = function(){ PDFJS = null; rej(new Error('No se ha podido cargar el lector de PDF.')); };
    document.head.appendChild(s);
  });
  return PDFJS;
}
function abrePdf(datos){
  return cargaPdfJs().then(function(L){
    return L.getDocument({data:datos, isEvalSupported:false, disableFontFace:true,
      standardFontDataUrl:'vendor/pdfjs/standard_fonts/'}).promise;
  });
}
function leePdf(file){
  return file.arrayBuffer().then(abrePdf).then(function(pdf){
    var n = Math.min(pdf.numPages, 3), ps = [];
    for(var i=1;i<=n;i++) ps.push(pdf.getPage(i).then(function(p){ return p.getTextContent().then(function(tc){ return {page:p, items:tc.items}; }); }));
    return Promise.all(ps).then(function(paginas){
      var lineas = [];
      paginas.forEach(function(pg){ lineas = lineas.concat(agrupaLineas(pg.items)); });
      return miniaturaPdf(paginas[0].page).then(function(mini){ return {lineas:lineas, miniatura:mini}; });
    });
  });
}
function miniaturaPdf(page){
  var vp0 = page.getViewport({scale:1}), vp = page.getViewport({scale:240/vp0.width});
  var c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  var g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  return page.render({canvasContext:g, viewport:vp}).promise.then(function(){
    try{ return c.toDataURL('image/jpeg', 0.75); }catch(e){ return null; }
  }, function(){ return null; });
}
// Reconstruye las líneas del PDF a partir de la posición de cada trozo de
// texto. Dos o más espacios separan columnas (etiqueta ··· valor).
function agrupaLineas(items){
  var trozos = items.filter(function(t){ return t.str && t.str.trim(); }).map(function(t){
    return {x:t.transform[4], y:t.transform[5], w:t.width||0, s:t.str};
  });
  trozos.sort(function(a,b){ return Math.abs(b.y-a.y)>2.5 ? b.y-a.y : a.x-b.x; });
  var lineas = [], act = null;
  trozos.forEach(function(t){
    if(!act || Math.abs(act.y - t.y) > 2.5){ act = {y:t.y, t:[]}; lineas.push(act); }
    act.t.push(t);
  });
  return lineas.map(function(l){
    l.t.sort(function(a,b){ return a.x-b.x; });
    var s = '', fin = null;
    l.t.forEach(function(t){
      if(fin!==null){ var gap = t.x - fin; s += gap > 14 ? '   ' : gap > 1.2 ? ' ' : ''; }
      s += t.s; fin = t.x + t.w;
    });
    return s.replace(/\s+$/,'').replace(/^\s+/,'');
  }).filter(function(s){ return s; });
}

// --- Lectura de datos de la factura --------------------------------------------
var RE_NIF = /(?:^|[^A-Z0-9])((?:ES)?(?:[ABCDEFGHJNPQRSUVW]\d{7}[0-9A-J]|\d{8}[A-HJ-NP-TV-Z]|[XYZ]\d{7}[A-HJ-NP-TV-Z]))(?![A-Z0-9])/g;
var RE_IMPORTE = /-?\d{1,3}(?:\.\d{3})+,\d{2}|-?\d{1,3}(?:,\d{3})+\.\d{2}|-?\d+[,.]\d{2}(?!\d)/g;
function nifsDe(linea){
  var limpia = linea.toUpperCase().replace(/(\w)[.\-\s](?=\d)/g,'$1').replace(/(\d)[.\-\s](?=[A-Z0-9])/g,'$1');
  var out = [], m; RE_NIF.lastIndex = 0;
  while((m = RE_NIF.exec(limpia))) out.push(m[1].replace(/^ES/,''));
  return out;
}
function importesDe(linea){
  var sin = linea.replace(/\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/g,' ');
  return (sin.match(RE_IMPORTE)||[]).map(parseImporte);
}
function fechaDe(linea){
  var m = linea.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4}|\d{2})\b/);
  if(m){ var y = m[3].length===2 ? '20'+m[3] : m[3]; return iso(y, m[2], m[1]); }
  m = linea.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if(m) return iso(m[1], m[2], m[3]);
  m = linea.toLowerCase().match(/\b(\d{1,2})\s+(?:de\s+)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\s+(?:de\s+|del\s+)?(\d{4})\b/);
  if(m) return iso(m[3], MESES_LARGO.indexOf(m[2]==='setiembre'?'septiembre':m[2])+1, m[1]);
  return null;
}
function iso(y, mo, d){
  y=Number(y); mo=Number(mo); d=Number(d);
  if(y<2000 || y>2100 || mo<1 || mo>12 || d<1 || d>31) return null;
  return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function patronesMarca(m){
  var n = m.nombre, ps = [n], par = n.match(/^(.*?)\s*\((.*)\)\s*$/);
  if(par){ ps.push(par[1]); ps.push(par[2]); }
  if(/^grupo\s+/i.test(n)) ps.push(n.replace(/^grupo\s+/i,''));
  ps.push(n.replace(/\s+/g,''));
  return ps.filter(function(p){ return p && p.length>=3; }).map(function(p){
    var e = p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s*');
    return new RegExp('(^|[^A-Za-z0-9])'+e+'([^A-Za-z0-9]|$)', p.length<=4 ? '' : 'i');
  });
}
function adivinaCategoria(texto){
  var t = texto.toLowerCase(), reglas = [
    [/google|microsoft|adobe|amazon web|aws|hostalia|hosting|dominio|software|licencia|suscripci|saas|notion|slack|canva|openai|apple\.com/, 'Software y suscripciones'],
    [/iberdrola|endesa|naturgy|repsol luz|holaluz|electricidad|suministro|agua|canal de isabel|movistar|vodafone|orange|digi|fibra|telefon/, 'Suministros (luz, agua, teléfono)'],
    [/renfe|iberia|vueling|ryanair|air europa|uber|cabify|taxi|hotel|booking|gasolin|combustible|cepsa|galp|parking|peaje/, 'Transporte y viajes'],
    [/meta platforms|facebook|instagram|linkedin|google ads|publicidad|marketing|anuncio/, 'Publicidad y marketing'],
    [/alquiler|arrendamiento|renta del local/, 'Alquiler'],
    [/seguro|mapfre|axa|allianz|mutua|comisi[oó]n bancaria|banco|bbva|santander|caixabank|sabadell/, 'Bancos y seguros'],
    [/asesor|gestor[ií]a|abogad|notar|consultor|auditor|registro mercantil|honorarios/, 'Servicios profesionales'],
    [/formaci[oó]n|curso|academia|matr[ií]cula/, 'Formación'],
    [/papeler|material de oficina|toner|amazon/, 'Material de oficina'],
    [/agencia tributaria|tasa|ayuntamiento|impuesto/, 'Impuestos y tasas']
  ];
  for(var i=0;i<reglas.length;i++) if(reglas[i][0].test(t)) return reglas[i][1];
  return '';
}
function extraeDatos(lineas, extra){
  var d = {}, auto = extra.auto, texto = lineas.join('\n');
  var marcar = function(k, v){ if(v!==null && v!==undefined && v!==''){ d[k]=v; auto[k]=true; } };

  // Marca: por su nombre en el documento. Si salen Evolvix y una marca
  // (Labs24k, ICC...), gana la marca: la sociedad aparece en todas.
  var halladas = MARCAS.lista.filter(function(m){ return patronesMarca(m).some(function(re){ return re.test(texto); }); });
  if(halladas.length>1) halladas = halladas.filter(function(m){ return m.prefijo!=='EVO'; }).concat(halladas.filter(function(m){ return m.prefijo==='EVO'; }));
  if(halladas.length) marcar('marca_id', Number(halladas[0].id));
  else { var grupo = MARCAS.lista.filter(function(m){ return m.prefijo==='EVO'; })[0]; if(grupo) d.marca_id = Number(grupo.id); }

  // NIF: el nuestro (el de las marcas) frente al de la otra parte.
  var propios = {}; MARCAS.lista.forEach(function(m){ var c=(m.cif||'').toUpperCase().replace(/[^A-Z0-9]/g,''); if(c) propios[c]=1; });
  var nifs = [];
  lineas.forEach(function(l, i){ nifsDe(l).forEach(function(n){ if(!nifs.some(function(x){ return x.n===n; })) nifs.push({n:n, i:i}); }); });
  var hayPropio = nifs.some(function(x){ return propios[x.n]; });

  // ¿Emitida o recibida? Quien aparece primero (arriba) es quien emite.
  var tipo = null;
  if(hayPropio){ tipo = propios[nifs[0].n] ? 'emitida' : 'recibida'; }
  else if(halladas.length){
    var re = patronesMarca(halladas[0]), lin = -1;
    lineas.some(function(l, i){ if(re.some(function(r){ return r.test(l); })){ lin=i; return true; } return false; });
    var etiquetaCliente = -1;
    lineas.some(function(l, i){ if(/\b(cliente|facturar a|destinatario|datos del cliente|bill to|customer)\b/i.test(l)){ etiquetaCliente=i; return true; } return false; });
    if(etiquetaCliente>=0 && lin>etiquetaCliente && lin-etiquetaCliente<=4) tipo = 'recibida';
    else tipo = lin>=0 && lin < Math.max(6, lineas.length*0.2) ? 'emitida' : 'recibida';
  }
  if(tipo) marcar('tipo', tipo);
  var t = tipo || 'recibida';

  var otros = nifs.filter(function(x){ return !propios[x.n]; });
  var suyo = hayPropio ? otros[0] : (t==='emitida' ? (nifs[1]||null) : nifs[0]);
  if(suyo){
    marcar('nif', suyo.n);
    var nombre = nombreJunto(lineas, suyo.i, suyo.n);
    if(nombre) marcar('contraparte', nombre);
  }
  if(!d.contraparte && t==='recibida'){
    var primera = lineas.filter(function(l){ return /[A-Za-zÁÉÍÓÚÑáéíóúñ]{3,}/.test(l) && !/factura|invoice|fecha|p[aá]gina/i.test(l); })[0];
    if(primera) marcar('contraparte', primera.split(/\s{3,}/)[0].slice(0,120));
  }

  // Número de factura.
  var RE_NUM = /(?:factura|fra\.?|invoice)\s*(?:n\.?\s*[º°o]\.?|n[uú]m(?:ero)?\.?|no\.?|number|#)?\s*[:.]?\s*([A-Z0-9][A-Z0-9\/\-_.]*\d[A-Z0-9\/\-_.]*)/i;
  var RE_NUM2 = /(?:n\.?\s*[º°o]|n[uú]m(?:ero)?\.?)\s*(?:de\s+)?(?:factura|fra\.?)?\s*[:.]?\s*([A-Z0-9][A-Z0-9\/\-_.]*\d[A-Z0-9\/\-_.]*)/i;
  for(var i=0;i<lineas.length && !d.numero;i++){
    var m = lineas[i].match(RE_NUM) || lineas[i].match(RE_NUM2);
    if(m && !fechaDe(m[1]) && !/^\d{1,2}[.,]\d{2}$/.test(m[1])) marcar('numero', m[1].replace(/[.:]$/,''));
    else if(/^(n[º°.]?\s*(de\s+)?factura|n[uú]mero( de factura)?|factura n[º°])\s*:?$/i.test(lineas[i].trim()) && lineas[i+1]){
      var sig = lineas[i+1].split(/\s{3,}/)[0].trim();
      if(/\d/.test(sig) && sig.length<=30 && !fechaDe(sig)) marcar('numero', sig);
    }
  }

  // Fechas: la de la factura y, si la hay, la de vencimiento.
  var fEmi = null, fVen = null, primera = null;
  lineas.forEach(function(l, i){
    var f = fechaDe(l), fn = !f && lineas[i+1] ? fechaDe(lineas[i+1]) : null;
    if(f && !primera) primera = f;
    if(/venc|vto\.?|due date|fecha l[ií]mite|pagar antes/i.test(l)){ if(!fVen) fVen = f || fn; }
    else if(/fecha|date|emisi[oó]n|expedici[oó]n/i.test(l) && !/entrega|servicio|pedido|alta|nacimiento/i.test(l)){ if(!fEmi) fEmi = f || fn; }
  });
  marcar('fecha', fEmi || primera);
  if(fVen && fVen !== (fEmi||primera)) marcar('vencimiento', fVen);

  // Importes.
  var ultimo = function(re, excl){
    var val = null;
    lineas.forEach(function(l, i){
      if(!re.test(l) || (excl && excl.test(l))) return;
      var a = importesDe(l); if(!a.length && lineas[i+1]) a = importesDe(lineas[i+1]);
      if(a.length) val = a[a.length-1];
    });
    return val;
  };
  var total = null;
  lineas.forEach(function(l, i){
    if(!/\btotal\b/i.test(l) || /sub\s*-?total|total\s*(base|bruto|iva|i\.v\.a|impuestos?|neto|l[ií]nea|unidades)|base\s*total/i.test(l)) return;
    var a = importesDe(l); if(!a.length && lineas[i+1]) a = importesDe(lineas[i+1]);
    a.forEach(function(x){ if(total===null || Math.abs(x)>Math.abs(total)) total = x; });
  });
  var base = ultimo(/base\s*imponible|sub\s*-?total|importe\s*neto|total\s*base|base\s*total|^\s*base\b|\bneto\b/i);
  var ivaPct = null, cuotaIva = null, irpfPct = null, cuotaIrpf = null;
  lineas.forEach(function(l, i){
    var m = l.match(/(?:\biva\b|i\.v\.a\.?|\bvat\b|impuesto)\D{0,20}?(\d{1,2}(?:[.,]\d{1,2})?)\s*%/i) || l.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%\s*(?:de\s+)?(?:iva|i\.v\.a|vat)/i);
    if(m && ivaPct===null) ivaPct = parseImporte(m[1]);
    if(/\biva\b|i\.v\.a|\bvat\b|cuota/i.test(l) && !/base|total|sin iva|iva incluido|exento/i.test(l)){
      var a = importesDe(l.replace(/\d{1,2}(?:[.,]\d{1,2})?\s*%/g,' '));
      if(a.length) cuotaIva = (cuotaIva||0) + a[a.length-1];
    }
    var mr = l.match(/(?:irpf|retenci[oó]n)\D{0,20}?(\d{1,2}(?:[.,]\d{1,2})?)\s*%/i) || l.match(/(\d{1,2}(?:[.,]\d{1,2})?)\s*%\s*(?:de\s+)?(?:irpf|retenci)/i);
    if(mr && irpfPct===null) irpfPct = parseImporte(mr[1]);
    if(/irpf|retenci[oó]n/i.test(l)){
      var b = importesDe(l.replace(/\d{1,2}(?:[.,]\d{1,2})?\s*%/g,' '));
      if(b.length && cuotaIrpf===null) cuotaIrpf = Math.abs(b[b.length-1]);
    }
  });
  if(/exento de iva|iva exento|exenta de iva|inversi[oó]n del sujeto pasivo/i.test(texto) && ivaPct===null){ ivaPct = 0; cuotaIva = 0; }

  // Cuadrar: base + IVA − IRPF = total, rellenando lo que falte.
  if(base===null && total!==null){
    var p = ivaPct!==null ? ivaPct : 21, rp = irpfPct||0;
    base = cuotaIva!==null ? r2(total - cuotaIva + (cuotaIrpf||0)) : r2(total/(1+p/100-rp/100));
  }
  if(base!==null){
    if(ivaPct===null && cuotaIva!==null && base) ivaPct = [0,4,5,10,21].reduce(function(a,x){ return Math.abs(x-cuotaIva/base*100)<Math.abs(a-cuotaIva/base*100)?x:a; }, 21);
    if(ivaPct===null && total!==null && base){
      var deducido = (total + (cuotaIrpf||0) - base)/base*100;
      ivaPct = [0,4,5,10,21].reduce(function(a,x){ return Math.abs(x-deducido)<Math.abs(a-deducido)?x:a; }, 21);
    }
    if(ivaPct===null) ivaPct = 21;
    if(cuotaIva===null || (Math.abs(cuotaIva - base*ivaPct/100) > Math.max(1, base*0.02) && total===null)) cuotaIva = r2(base*ivaPct/100);
    if(irpfPct && cuotaIrpf===null) cuotaIrpf = r2(base*irpfPct/100);
    if(cuotaIrpf && !irpfPct && base) irpfPct = Math.round(cuotaIrpf/base*100);
    marcar('base', r2(base)); marcar('iva_pct', ivaPct); marcar('cuota_iva', r2(cuotaIva));
    if(cuotaIrpf){ marcar('irpf_pct', irpfPct||0); marcar('cuota_irpf', r2(cuotaIrpf)); }
  }
  if(total!==null) extra.totalLeido = r2(total);

  if(t==='recibida') marcar('categoria', adivinaCategoria(texto));
  return d;
}
function nombreJunto(lineas, i, nif){
  // Trozos de la línea que son otra cosa (fecha, nº de factura...) en
  // otra columna a la misma altura, no el nombre.
  var otraCosa = /fecha|factura|invoice|n[º°]|vencimiento|date|p[aá]gina|tel[eé]f|e-?mail|@/i;
  var limpia = function(s){
    return s.split(/\s{3,}/).filter(function(p){ return (nifsDe(p).indexOf(nif)<0 || p.replace(/[^A-Za-z]/g,'').length>12) && !otraCosa.test(p) && !fechaDe(p); })
      .join(' ').replace(/\b(c\.?i\.?f\.?|n\.?i\.?f\.?|vat|dni|nie|cif\/nif|nif\/cif)\b\s*[:.]?/ig,'').replace(nif,'').replace(/[:;,\s]+$/,'').trim();
  };
  var esEtiqueta = /^(cliente|proveedor|emisor|datos( fiscales| del cliente)?|facturar a|destinatario|bill to|customer|factura|direcci[oó]n|domicilio)\s*:?$/i;
  var mismo = limpia(lineas[i]);
  if(/[A-Za-zÁÉÍÓÚÑ]{3,}/.test(mismo) && !esEtiqueta.test(mismo) && mismo.length<=120) return mismo;
  var cand = [];
  for(var k=i-1; k>=Math.max(0,i-4); k--){
    var s = lineas[k].split(/\s{3,}/)[0].trim();
    if(!s || esEtiqueta.test(s) || /\d{5}|calle|c\/|avda|avenida|plaza|tel[eé]f|@|www\.|http/i.test(s) || !/[A-Za-zÁÉÍÓÚÑ]{3,}/.test(s)) continue;
    cand.push(s);
  }
  var sociedad = cand.filter(function(s){ return /\b(s\.?l\.?u?|s\.?a\.?u?|s\.?c\.?p?|s\.?coop|ltd|gmbh|inc|llc|sociedad)\b\.?/i.test(s); })[0];
  return (sociedad || cand[0] || '').slice(0,120);
}

function edDe(d){
  if(!UP.edit[d.id]){
    UP.edit[d.id] = {tipo:d.tipo, marca_id:Number(d.marca_id), numero:d.numero||'', fecha:d.fecha||'', vencimiento:d.vencimiento||'',
      contraparte:d.contraparte||'', nif:d.nif||'', categoria:d.categoria||'', concepto:d.concepto||'',
      base:numIn(d.base), iva_pct:numIn(d.iva_pct)||'0', cuota_iva:numIn(d.cuota_iva), irpf_pct:numIn(d.irpf_pct), cuota_irpf:numIn(d.cuota_irpf)};
  }

}
function totalEd(e){ return r2(parseImporte(e.base) + parseImporte(e.cuota_iva) - parseImporte(e.cuota_irpf)); }
function faltanDatos(e){
  var f = [];

  if(!e.fecha) f.push('fecha');
  if(!String(e.contraparte).trim()) f.push(e.tipo==='emitida'?'cliente':'proveedor');
  if(!parseImporte(e.base) && !totalEd(e)) f.push('importes');

function cuerpoEd(e){

    contraparte:e.contraparte, nif:e.nif, categoria:e.tipo==='recibida'?e.categoria:'', concepto:e.concepto,
    base:r2(parseImporte(e.base)), iva_pct:parseImporte(e.iva_pct), cuota_iva:r2(parseImporte(e.cuota_iva)),
    irpf_pct:parseImporte(e.irpf_pct), cuota_irpf:r2(parseImporte(e.cuota_irpf))};
}

function enlazaBorrador(d){
  qa('[data-bd="'+d.id+'"]').forEach(function(el){
    var k = el.dataset.k;
    var cambia = function(){
      var e = edDe(d), v = el.value;
      e[k] = k==='marca_id' ? Number(v) : v;
      if(UP.extra[d.id] && UP.extra[d.id].auto){ delete UP.extra[d.id].auto[k]; el.classList.remove('auto'); }
      // Al tocar la base o un porcentaje se recalcula la cuota; la cuota se
      // puede corregir a mano (facturas con varios tipos de IVA).
      if(k==='base' || k==='iva_pct'){ e.cuota_iva = numIn(r2(parseImporte(e.base)*parseImporte(e.iva_pct)/100)); var ci=q('#bd-'+d.id+'-cuota_iva'); if(ci) ci.value=e.cuota_iva; }
      if(k==='base' || k==='irpf_pct'){ e.cuota_irpf = numIn(r2(parseImporte(e.base)*parseImporte(e.irpf_pct)/100)); var cr=q('#bd-'+d.id+'-cuota_irpf'); if(cr) cr.value=e.cuota_irpf; }
      actualizaPie(d);
      guardaLuego(d);
      if(k==='tipo') renderApp();
    };
    el.oninput = cambia; if(el.tagName==='SELECT' || el.type==='date') el.onchange = cambia;
  });
  var ok = q('[data-bd-ok="'+d.id+'"]'); if(ok) ok.onclick = function(){ contabiliza(d); };
  var del = q('[data-bd-del="'+d.id+'"]'); if(del) del.onclick = function(){
    if(!confirm('¿Descartar este borrador? Se borra el archivo subido. (Una factura ya contabilizada nunca se borra.)')) return;
    clearTimeout(UP.timers[d.id]);
    apiDelete('documentos.php?id='+d.id).then(function(r){
      if(!r.ok){ toast('No se ha podido descartar: '+apiMensaje(r)); return; }
      DATA.docs = DATA.docs.filter(function(x){ return x.id!==d.id; });
      delete UP.edit[d.id]; toast('Borrador descartado.'); renderApp();
    });
  };
}
function actualizaPie(d){
  var e = edDe(d), x = UP.extra[d.id] || {}, t = totalEd(e), falta = faltanDatos(e);
  var tt = q('#bd-'+d.id+'-total'); if(tt) tt.textContent = eur(t);
  var ds = q('#bd-'+d.id+'-desc'); if(ds) ds.style.display = (x.totalLeido!=null && Math.abs(x.totalLeido-t)>0.02) ? '' : 'none';
  var fl = q('#bd-'+d.id+'-falta'); if(fl){ fl.style.display = falta.length ? '' : 'none'; fl.textContent = 'Falta: '+falta.join(', '); }
}
// Lo que se va corrigiendo se guarda solo (como borrador), para que otra
// persona —o tú mañana— lo encuentre tal cual.
function guardaLuego(d){
  clearTimeout(UP.timers[d.id]);
  UP.timers[d.id] = setTimeout(function(){
    apiPatch('documentos.php?id='+d.id, cuerpoEd(edDe(d))).then(function(r){
      if(r.ok) DATA.docs = DATA.docs.map(function(x){ return x.id===d.id ? r.datos.datos : x; });
    });
  }, 900);
}
function contabiliza(d, silencioso){
  clearTimeout(UP.timers[d.id]);
  var e = edDe(d), falta = faltanDatos(e);
  if(falta.length){ if(!silencioso) toast('Para contabilizar falta: '+falta.join(', ')+'.'); return Promise.resolve(false); }
  var cuerpo = cuerpoEd(e); cuerpo.contabilizar = true;
  return apiPatch('documentos.php?id='+d.id, cuerpo).then(function(r){
    if(!r.ok){ toast('No se ha podido contabilizar: '+apiMensaje(r)); return false; }
    var tarjeta = q('#doc-'+d.id); if(tarjeta) tarjeta.classList.add('listo');
    return new Promise(function(res){ setTimeout(function(){
      DATA.docs = DATA.docs.map(function(x){ return x.id===d.id ? r.datos.datos : x; });
      delete UP.edit[d.id];
      if(!silencioso) toast('Contabilizada: '+(e.numero||'factura')+' · '+eur(r.datos.datos.total));
      renderApp(); res(true);
    }, 420); });
  });
}
function contabilizaTodas(){
  var lista = DATA.docs.filter(function(d){ return !d.contabilizado && !faltanDatos(edDe(d)).length; });
  var hechas = 0;
  lista.reduce(function(p, d){ return p.then(function(){ return contabiliza(d, true).then(function(ok){ if(ok) hechas++; }); }); }, Promise.resolve())
    .then(function(){ toast(hechas+' factura'+(hechas!==1?'s':'')+' contabilizada'+(hechas!==1?'s':'')+'.'); });
}
// Miniatura de un borrador que ya estaba subido (p. ej. tras recargar).
function cargaMiniatura(d){
  if(UP.thumbs[d.id] || UP.thumbPend[d.id] || !d.tiene_archivo) return;
  UP.thumbPend[d.id] = true;
  fetch(urlArchivo(d.id), {credentials:'same-origin'}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){
    if(/pdf/.test(b.type)) return b.arrayBuffer().then(abrePdf).then(function(pdf){ return pdf.getPage(1); }).then(miniaturaPdf);
    return createImageBitmap(b).then(function(bmp){ return dibujaMiniatura(bmp, bmp.width, bmp.height); });
  }).then(function(mini){
    if(!mini) return;
    UP.thumbs[d.id] = mini;
    var el = q('#th-'+d.id);
    if(el){ var img = document.createElement('img'); img.id='th-'+d.id; img.src=mini; img.alt='Miniatura de la factura'; el.parentNode.replaceChild(img, el); }
  }).catch(function(){});
}

// Arrastrar facturas a cualquier parte del panel.
var DRAG = { n:0 };
function llevaArchivos(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[], 'Files')>=0; }
function capaArrastre(si){
  var c = q('#drop-ov');
  if(si && !c){
    c = document.createElement('div'); c.id='drop-ov'; c.className='drop-ov';
    c.innerHTML = '<div class="in">'+ic('upload',34)+'<br>Suelta las facturas para subirlas<div>'+
      (UP.tipo==='auto' ? 'El panel detectará si son emitidas o recibidas, y de qué marca.' : 'Se subirán como '+(UP.tipo==='emitida'?'emitidas':'recibidas')+'.')+'</div></div>';
    document.body.appendChild(c);
  } else if(!si && c) c.parentNode.removeChild(c);
}
document.addEventListener('dragenter', function(e){ if(!S.logged || !llevaArchivos(e)) return; e.preventDefault(); DRAG.n++; capaArrastre(true); });
document.addEventListener('dragover', function(e){ if(!S.logged || !llevaArchivos(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
document.addEventListener('dragleave', function(e){ if(!S.logged || !llevaArchivos(e)) return; DRAG.n = Math.max(0, DRAG.n-1); if(!DRAG.n) capaArrastre(false); });
document.addEventListener('drop', function(e){ if(!S.logged || !llevaArchivos(e)) return; e.preventDefault(); DRAG.n=0; capaArrastre(false); subeArchivos(e.dataTransfer.files); });

function viewCobros(v){
  if(!DATA.cargado){ v.innerHTML = cargando(); return; }
  var hoy = hoyISO();
  var abiertas = filasLibro().filter(function(f){ return f.estado==='Pendiente' || f.estado==='Impagada'; });
  var limite = function(f){ return f.vencimiento || null; };
  var orden = function(a,b){ return (limite(a)||'9999').localeCompare(limite(b)||'9999') || (a.fecha||'').localeCompare(b.fecha||''); };
  var cobros = abiertas.filter(function(f){ return f.tipo==='emitida'; }).sort(orden);
  var pagos = abiertas.filter(function(f){ return f.tipo==='recibida'; }).sort(orden);
  var vencida = function(f){ return f.estado==='Impagada' || (f.vencimiento && f.vencimiento < hoy); };
  var tot = function(l){ return l.reduce(function(a,f){ return a+f.total; }, 0); };

  var lista = function(l, esEm){
    return l.map(function(f){
      var cuando;
      if(f.estado==='Impagada') cuando = '<span class="chip red">Impagada</span>';
      else if(f.vencimiento){
        var dd = diasEntre(hoy, f.vencimiento);
        cuando = dd<0 ? '<span class="chip red">Vencida hace '+(-dd)+' día'+(dd===-1?'':'s')+'</span>' :
          dd===0 ? '<span class="chip amber">Vence hoy</span>' : '<span class="chip'+(dd<=7?' amber':'')+'">Vence en '+dd+' día'+(dd===1?'':'s')+'</span>';
      } else {
        var hace = f.fecha ? Math.max(0, diasEntre(f.fecha, hoy)) : null;
        cuando = '<span class="tiny muted">'+(hace===null ? 'sin fecha' : hace===0 ? 'factura de hoy' : 'factura de hace '+hace+' día'+(hace===1?'':'s'))+'</span>';
      }
      return '<tr><td style="width:100%"><div class="row" style="gap:8px">'+dotMarca(f.marca_id)+'<div style="min-width:0"><div class="trunc" style="max-width:260px">'+esc(f.contraparte||'—')+'</div>'+
          '<div class="tiny muted">'+esc(f.numero||'')+' · '+fFecha(f.fecha)+'</div></div></div></td>'+
        '<td class="num"><b style="font-weight:600">'+eur(f.total)+'</b><div style="margin-top:4px">'+cuando+'</div></td>'+
        '<td class="acc"><button class="btn btn-xs" data-cp="'+f.key+'" title="Marcar como '+(esEm?'cobrada':'pagada')+'">'+ic('check',13)+' '+(esEm?'Cobrada':'Pagada')+'</button></td></tr>';
    }).join('') || '<tr><td colspan="3" class="muted" style="text-align:center;padding:24px">'+(esEm?'Nada pendiente de cobro.':'Nada pendiente de pago.')+'</td></tr>';
  };

  v.innerHTML =
  '<div class="grid g-4" style="margin-bottom:16px">'+
    '<div class="card kpi"><div class="lbl">Por cobrar</div><div class="val" style="color:var(--amber)">'+eur(tot(cobros))+'</div><div class="sub">'+cobros.length+' facturas emitidas</div></div>'+
    '<div class="card kpi"><div class="lbl">Cobros vencidos o impagados</div><div class="val" style="color:var(--red)">'+eur(tot(cobros.filter(vencida)))+'</div><div class="sub">'+cobros.filter(vencida).length+' facturas a reclamar</div></div>'+
    '<div class="card kpi"><div class="lbl">Por pagar</div><div class="val">'+eur(tot(pagos))+'</div><div class="sub">'+pagos.length+' facturas de proveedores</div></div>'+
    '<div class="card kpi"><div class="lbl">Pagos vencidos</div><div class="val" style="color:var(--red)">'+eur(tot(pagos.filter(vencida)))+'</div><div class="sub">'+pagos.filter(vencida).length+' facturas</div></div>'+
  '</div>'+
  '<div class="grid g-2">'+
    '<div class="card"><div class="card-h"><div><h3>Cobros pendientes</h3><p>Lo que nos deben, lo más urgente arriba.</p></div></div>'+
      '<div class="tbl-wrap"><table class="tbl cp"><tbody>'+lista(cobros, true)+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-h"><div><h3>Pagos pendientes</h3><p>Lo que debemos a proveedores.</p></div></div>'+
      '<div class="tbl-wrap"><table class="tbl cp"><tbody>'+lista(pagos, false)+'</tbody></table></div></div>'+
  '</div>';

  qa('[data-cp]').forEach(function(b){ b.onclick=function(){
    var f = abiertas.filter(function(x){ return x.key===b.dataset.cp; })[0]; cambiaEstado(f, 'Pagada');
  }; });
}

    return '<tr>'+
      '<td><div class="row" style="gap:9px">'+dotMarca(m.id)+esc(m.nombre)+'</div></td>'+
      '<td class="muted">'+esc(m.prefijo||'')+'</td>'+
      '<td class="muted">'+esc(m.cif||'—')+'</td>'+
      '<td class="muted">'+esc(m.email||'—')+'</td>'+
      '<td>'+(m.activa?'<span class="chip green">Activa</span>':'<span class="chip">Inactiva</span>')+'</td>'+
      (esAdmin() ? '<td class="acc"><button class="btn btn-xs" data-mk-toggle="'+m.id+'" data-activa="'+m.activa+'">'+(m.activa?'Desactivar':'Activar')+'</button></td>' : '<td></td>')+
    '</tr>';
  }).join('') || '<tr><td colspan="6" class="muted" style="text-align:center;padding:26px">Sin marcas.</td></tr>';

  v.innerHTML =
  '<div class="card">'+
    '<div class="card-h"><div><h3>Marcas del grupo</h3><p>Grupo Evolvix Global y sus marcas registradas. Cada cliente y cada factura cuelgan de una de ellas.</p></div>'+
      (esAdmin() ? '<button class="btn btn-p" id="mk-nuevo">'+ic('plus',16)+' Nueva marca</button>' : '')+
    '</div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Marca</th><th>Prefijo</th><th>CIF</th><th>Correo</th><th>Estado</th><th></th></tr></thead><tbody>'+filas+'</tbody></table></div>'+
    '<p class="tiny muted" style="margin:12px 0 0">Consejo: si pones el CIF del grupo en las marcas, el panel distingue mejor solo las facturas emitidas de las recibidas.</p>'+
  '</div>'+
  (MARCAS.nuevo ? mkModal() : '');

  if(esAdmin() && q('#mk-nuevo')) q('#mk-nuevo').onclick = mkNuevo;
  qa('[data-mk-toggle]').forEach(function(b){ b.onclick=function(){ mkActiva(Number(b.dataset.mkToggle), b.dataset.activa!=='true'); }; });

  if(MARCAS.nuevo){
    q('#mkn-nombre').oninput=function(){ MARCAS.nuevo.nombre=this.value; };
    q('#mkn-cif').oninput=function(){ MARCAS.nuevo.cif=this.value; };
    q('#mkn-email').oninput=function(){ MARCAS.nuevo.email=this.value; };
    q('#mkn-color').onchange=function(){ MARCAS.nuevo.color=this.value; };
    q('#mkn-cancela').onclick=function(){ MARCAS.nuevo=null; renderApp(); };
    q('#mkn-guarda').onclick=mkGuarda;
  }
}
function mkModal(){
  var n = MARCAS.nuevo;
  return '<div class="ov"><div class="modal">'+
    '<h3 style="margin:0 0 16px">Nueva marca</h3>'+
    '<div class="field"><label>Nombre *</label><input class="inp" id="mkn-nombre" value="'+esc(n.nombre)+'"></div>'+
    '<div class="field"><label>CIF</label><input class="inp" id="mkn-cif" value="'+esc(n.cif)+'"></div>'+
    '<div class="field"><label>Correo</label><input class="inp" id="mkn-email" value="'+esc(n.email)+'"></div>'+
    '<div class="field"><label>Color</label><input class="inp" type="color" id="mkn-color" value="'+esc(n.color)+'" style="height:40px;padding:4px"></div>'+
    '<div class="row" style="gap:10px;justify-content:flex-end;margin-top:8px">'+
      '<button class="btn" id="mkn-cancela">Cancelar</button>'+
      '<button class="btn btn-p" id="mkn-guarda">Crear</button></div>'+
  '</div></div>';
}

/* ------------------------------ CLIENTES ---------------------------------- */
function clNuevo(){ CLIENTES.nuevo = {marca_id: (MARCAS.lista[0]&&MARCAS.lista[0].id)||'', nombre:'', cif:'', email:'', telefono:'', contacto:''}; renderApp(); }
function clGuarda(){
  var n = CLIENTES.nuevo;
  if(!n.nombre.trim()){ toast('Ponle un nombre al cliente.'); return; }
  if(!n.marca_id){ toast('Elige una marca.'); return; }
  apiPost('clientes.php', {marca_id:n.marca_id, nombre:n.nombre.trim(), cif:n.cif.trim(), email:n.email.trim(),
    telefono:n.telefono.trim(), contacto:n.contacto.trim()}).then(function(r){
    if(r&&r.ok){ CLIENTES.nuevo=null; toast('Cliente creado.'); cargaTodo(); }
    else toast('No se ha podido crear: '+apiMensaje(r));
  });
}
function viewClientes(v){
  if(!DATA.cargado){ v.innerHTML = cargando(); return; }
  var lista = CLIENTES.lista.filter(function(c){
    var t = (c.nombre+' '+c.email+' '+c.cif).toLowerCase();
    if(CLIENTES.filtro && t.indexOf(CLIENTES.filtro.toLowerCase().trim())<0) return false;
    if(CLIENTES.filtroMarca && String(c.marca_id)!==CLIENTES.filtroMarca) return false;
    return true;
  });

  var filas = lista.map(function(c){
    return '<tr><td>'+esc(c.nombre)+'<div class="tiny muted">'+esc(c.cif||'')+'</div></td>'+
      '<td><div class="row" style="gap:8px">'+dotMarca(c.marca_id)+esc(nombreMarca(c.marca_id))+'</div></td>'+
      '<td class="muted">'+esc(c.email||'—')+'</td>'+
      '<td class="muted">'+esc(c.telefono||'—')+'</td></tr>';
  }).join('') || '<tr><td colspan="4" class="muted" style="text-align:center;padding:26px">Sin clientes.</td></tr>';

  v.innerHTML =
  '<div class="card">'+
    '<div class="card-h"><div><h3>Clientes</h3><p>Clientes a los que se factura desde el CRM. Cada uno pertenece a una marca.</p></div>'+
      '<button class="btn btn-p" id="cl-nuevo">'+ic('plus',16)+' Nuevo cliente</button></div>'+
    '<div class="filtros">'+
      '<div class="search" style="flex:1;min-width:200px"><input id="cl-find" placeholder="Buscar..." value="'+esc(CLIENTES.filtro)+'"></div>'+
      '<select class="inp" id="cl-fmarca">'+opcionesMarca(CLIENTES.filtroMarca, 'Todas las marcas')+'</select></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Marca</th><th>Correo</th><th>Teléfono</th></tr></thead><tbody>'+filas+'</tbody></table></div>'+
  '</div>'+
  (CLIENTES.nuevo ? clModal() : '');

  q('#cl-find').oninput = function(){ CLIENTES.filtro=this.value; renderApp(); };
  q('#cl-fmarca').onchange = function(){ CLIENTES.filtroMarca=this.value; renderApp(); };
  q('#cl-nuevo').onclick = clNuevo;

  if(CLIENTES.nuevo){
    q('#cln-marca').onchange=function(){ CLIENTES.nuevo.marca_id=Number(this.value); };
    q('#cln-nombre').oninput=function(){ CLIENTES.nuevo.nombre=this.value; };
    q('#cln-cif').oninput=function(){ CLIENTES.nuevo.cif=this.value; };
    q('#cln-email').oninput=function(){ CLIENTES.nuevo.email=this.value; };
    q('#cln-tel').oninput=function(){ CLIENTES.nuevo.telefono=this.value; };
    q('#cln-contacto').oninput=function(){ CLIENTES.nuevo.contacto=this.value; };
    q('#cln-cancela').onclick=function(){ CLIENTES.nuevo=null; renderApp(); };
    q('#cln-guarda').onclick=clGuarda;
  }
}
function clModal(){
  var n = CLIENTES.nuevo;
  return '<div class="ov"><div class="modal">'+
    '<h3 style="margin:0 0 16px">Nuevo cliente</h3>'+
    '<div class="field"><label>Marca *</label><select class="inp" id="cln-marca">'+opcionesMarca(n.marca_id)+'</select></div>'+
    '<div class="field"><label>Nombre *</label><input class="inp" id="cln-nombre" value="'+esc(n.nombre)+'"></div>'+
    '<div class="field"><label>CIF</label><input class="inp" id="cln-cif" value="'+esc(n.cif)+'"></div>'+
    '<div class="field"><label>Correo</label><input class="inp" id="cln-email" value="'+esc(n.email)+'"></div>'+
    '<div class="field"><label>Teléfono</label><input class="inp" id="cln-tel" value="'+esc(n.telefono)+'"></div>'+
    '<div class="field"><label>Persona de contacto</label><input class="inp" id="cln-contacto" value="'+esc(n.contacto)+'"></div>'+
    '<div class="row" style="gap:10px;justify-content:flex-end;margin-top:8px">'+
      '<button class="btn" id="cln-cancela">Cancelar</button>'+
      '<button class="btn btn-p" id="cln-guarda">Crear</button></div>'+
  '</div></div>';
}

/* ------------------------ NUEVA FACTURA (CRM) ------------------------------- */
function fcNueva(){
  FACTURAS.nueva = {marca_id:(MARCAS.lista[0]&&Number(MARCAS.lista[0].id))||'', cliente_id:'', iva:21,
    lineas:[{descripcion:'', cantidad:1, precio_unitario:0}]};
  renderApp();
}
function fcAnadeLinea(){ FACTURAS.nueva.lineas.push({descripcion:'', cantidad:1, precio_unitario:0}); renderApp(); }
function fcQuitaLinea(i){ FACTURAS.nueva.lineas.splice(i,1); if(!FACTURAS.nueva.lineas.length) FACTURAS.nueva.lineas.push({descripcion:'',cantidad:1,precio_unitario:0}); renderApp(); }
function fcBaseTotal(){
  var n = FACTURAS.nueva;
  var base = n.lineas.reduce(function(a,l){ return a + (Number(l.cantidad)||0)*(Number(l.precio_unitario)||0); }, 0);
  var total = base * (1 + (Number(n.iva)||0)/100);
  return {base:base, total:total};
}
// Actualiza solo los dos importes del modal, sin volver a dibujar toda la
// página: así no se pierde el valor que la persona está escribiendo.
function fcActualizaTotales(){
  var t = fcBaseTotal();
  if(q('#fcn-base-val')) q('#fcn-base-val').textContent = eur(t.base);
  if(q('#fcn-total-val')) q('#fcn-total-val').textContent = eur(t.total);
}
function fcGuarda(){
  var n = FACTURAS.nueva;
  if(!n.marca_id){ toast('Elige una marca.'); return; }
  if(!n.cliente_id){ toast('Elige un cliente.'); return; }
  if(!n.lineas.some(function(l){ return l.descripcion.trim(); })){ toast('Añade al menos un concepto.'); return; }

  apiPost('facturas.php', {marca_id:n.marca_id, cliente_id:n.cliente_id, iva:n.iva, lineas:n.lineas}).then(function(r){
    if(!r||!r.ok){ toast('No se ha podido registrar: '+apiMensaje(r)); return; }
    toast('Factura registrada: '+((r.datos.datos&&r.datos.datos[0]&&r.datos.datos[0].numero)||'')); FACTURAS.nueva=null; cargaTodo();
  });
}
function enlazaFcModal(){
  q('#fcn-marca').onchange=function(){ FACTURAS.nueva.marca_id=Number(this.value); FACTURAS.nueva.cliente_id=''; renderApp(); };
  if(q('#fcn-cliente')) q('#fcn-cliente').onchange=function(){ FACTURAS.nueva.cliente_id=Number(this.value); };
  q('#fcn-iva').oninput=function(){ FACTURAS.nueva.iva=Number(this.value)||0; fcActualizaTotales(); };
  qa('[data-ln-desc]').forEach(function(el){ el.oninput=function(){ FACTURAS.nueva.lineas[Number(el.dataset.lnDesc)].descripcion=this.value; }; });
  qa('[data-ln-cant]').forEach(function(el){ el.oninput=function(){ FACTURAS.nueva.lineas[Number(el.dataset.lnCant)].cantidad=Number(this.value)||0; fcActualizaTotales(); }; });
  qa('[data-ln-precio]').forEach(function(el){ el.oninput=function(){ FACTURAS.nueva.lineas[Number(el.dataset.lnPrecio)].precio_unitario=Number(this.value)||0; fcActualizaTotales(); }; });
  qa('[data-ln-quita]').forEach(function(el){ el.onclick=function(){ fcQuitaLinea(Number(el.dataset.lnQuita)); }; });
  q('#fcn-anade').onclick=fcAnadeLinea;
  q('#fcn-cancela').onclick=function(){ FACTURAS.nueva=null; renderApp(); };
  q('#fcn-guarda').onclick=fcGuarda;
}
function fcModal(){
  var n = FACTURAS.nueva;
  var clientesDeMarca = CLIENTES.lista.filter(function(c){ return Number(c.marca_id)===Number(n.marca_id); });
  var t = fcBaseTotal();
  return '<div class="ov"><div class="modal" style="max-width:600px">'+
    '<h3 style="margin:0 0 16px">Nueva factura</h3>'+
    '<div class="grid g-2">'+
      '<div class="field"><label>Marca *</label><select class="inp" id="fcn-marca">'+opcionesMarca(n.marca_id)+'</select></div>'+
      '<div class="field"><label>Cliente *</label><select class="inp" id="fcn-cliente">'+
        '<option value="">Elige un cliente...</option>'+
        clientesDeMarca.map(function(c){ return '<option value="'+c.id+'"'+(Number(n.cliente_id)===Number(c.id)?' selected':'')+'>'+esc(c.nombre)+'</option>'; }).join('')+
      '</select>'+(clientesDeMarca.length?'':'<div class="tiny muted" style="margin-top:5px">Esta marca no tiene clientes todavía.</div>')+'</div>'+
    '</div>'+
    '<div class="field" style="margin-top:4px"><label>Conceptos (descripción · cantidad · precio)</label>'+
      n.lineas.map(function(l,i){
        return '<div class="row" style="gap:8px;margin-bottom:8px">'+
          '<input class="inp" style="flex:2;min-width:0" placeholder="Descripción" value="'+esc(l.descripcion)+'" data-ln-desc="'+i+'">'+
          '<input class="inp" style="flex:0 0 70px" type="number" min="0" step="0.01" value="'+l.cantidad+'" data-ln-cant="'+i+'">'+
          '<input class="inp" style="flex:0 0 100px" type="number" min="0" step="0.01" value="'+l.precio_unitario+'" data-ln-precio="'+i+'">'+
          '<button class="icon-btn" data-ln-quita="'+i+'" title="Quitar">'+ic('x',15)+'</button>'+
        '</div>';
      }).join('')+
      '<button class="btn btn-xs" id="fcn-anade">'+ic('plus',13)+' Añadir concepto</button></div>'+
    '<div class="field"><label>IVA (%)</label><input class="inp" id="fcn-iva" type="number" value="'+n.iva+'" style="max-width:120px"></div>'+
    '<div class="card" style="background:var(--card-2);margin-top:6px">'+
      '<div class="row" style="justify-content:space-between"><span class="muted tiny">Base</span><span id="fcn-base-val">'+eur(t.base)+'</span></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:6px"><strong>Total</strong><strong id="fcn-total-val">'+eur(t.total)+'</strong></div>'+
    '</div>'+
    '<div class="row" style="gap:10px;justify-content:flex-end;margin-top:16px">'+
      '<button class="btn" id="fcn-cancela">Cancelar</button>'+
      '<button class="btn btn-p" id="fcn-guarda">Registrar factura</button></div>'+
  '</div></div>';
}

document.addEventListener('DOMContentLoaded', boot);
</script>
